name: İmaj derle ve yayınla

# Yalnızca api imajını derleyip ghcr.io'ya iter. Ürün SPA'ları (PCB, Comm…)
# kendi depolarında kendi imajlarını yayınlar; deploy/docker-compose.yml onları
# ghcr'dan çeker — bkz. deploy/README.md.
#
# SUNUCUYA BAĞLANAN ADIM BİLEREK YOK: sunucu henüz yok, dolayısıyla depoda SSH
# sırrı da yok. Sunucu hazır olduğunda buraya bir `deploy` işi eklenir ya da
# sunucuda `git pull` + compose kullanılır — iki yol da aynı compose
# dosyalarıyla çalışır.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr.io/<sahip>/<depo> — deploy/.env içindeki PLATFORM_IMAGE_PREFIX ile
  # aynı olmalı.
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # İmaj derlemeden önce ayrı bir kapı: kırmızı xunit takımıyla `latest` imajı
  # ghcr.io'ya itilmesin. ci.yml ayrı bir iş akışı olduğu için bunu engellemez.
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test api/Alp.Api.sln -c Release

  image:
    name: api imajı
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/api
          # Hem `latest` hem commit sha'sı basılır. Geri alma sha etiketiyle
          # yapılır: deploy/.env içinde PLATFORM_IMAGE_TAG değiştirilip yığın
          # yeniden ayağa kaldırılır — yeniden derleme gerekmez.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          # Derleme bağlamı depo kökü: Dockerfile hem api/ kaynağını hem
          # assets/report-fonts/ altındaki rapor yazı tiplerini kökten alır.
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Yayınlanan imaj bilinen açıklara karşı taranır. Yalnızca CRITICAL/HIGH
      # ve DÜZELTMESİ ÇIKMIŞ bulgular işi kırar: düzeltmesi olmayan bir taban
      # imaj CVE'si her push'u kırmızıya boyar ve tarama gürültüye dönüşürdü.
      #
      # Etiket `v` ÖNEKLİ olmalı: eylem önekli etiketlemeye geçti ve öneksiz
      # `0.28.0` artık çözülmüyor. Çözülemeyen bir eylem referansı işi ilk
      # adımda değil KURULUM aşamasında düşürür — yani yukarıdaki push hiç
      # koşmaz.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/api:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
