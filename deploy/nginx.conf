# TLS'siz sunum — yerel yığın ve web imajının gömülü varsayılanı.
# Üretimde bunun yerine nginx.prod.conf bağlanır (bkz. docker-compose.prod.yml).
# İki dosyanın SPA ve /api blokları birebir aynı tutulur.
#
# DİKKAT — nginx'te `add_header` MİRAS ALINMAZ: bir `location` kendi
# `add_header`'ını yazdığı anda üst seviyedekilerin HEPSİ o konumda düşer.
# Bu yüzden güvenlik başlıkları, kendi başlığı olan her konumda tekrarlanır.
# Tek yere yazıp "sunucu seviyesinden gelir" varsaymak, tam da statik
# varlıklarda ve index.html'de başlıkların kaybolması demektir.

# Kenar hız sınırı — API'nin kendi kullanıcı-bazlı limiter'ının ÖNÜNDE kaba
# bir IP kapısı. İnce ayar uygulamada kalır (kullanıcı/uç başına politika);
# buradaki tek iş, uygulamaya hiç ulaşmaması gereken sel trafiğini nginx'te
# kesmek. conf.d dosyaları http bağlamına dahil edilir, zone burada tanımlanır.
limit_req_zone $binary_remote_addr zone=api_edge:10m rate=20r/s;

# Erişim günlüğünden SORGU DİZESİ düşürülür.
#
# Parola sıfırlama ve e-posta doğrulama bağlantıları token'ı sorguda taşır
# (Auth/AuthEndpoints.cs:131 ve :366), `GET /api/auth/confirm-email` de öyle.
# nginx'in varsayılan `combined` biçimi $request içinde tam sorguyu yazdığı
# için bu token'lar erişim günlüğüne DÜZ METİN düşerdi: günlüğü okuyabilen
# herkes — operatör, log toplayıcı, yedek arşivi — "parolamı unuttum"a
# tıklamış her hesabı token ömrü boyunca devralabilirdi.
#
# Uygulama tarafında aynı karar zaten verilmiş durumda: Serilog istek
# özetinde sorguyu taşımaz. Bu blok kenarı da aynı hizaya getirir.
#
# $uri değil $request_uri'nin sorgusuz hâli loglanır: $uri try_files
# yeniden yazımından SONRAKİ yoldur ve bilinmeyen adresler için istenen yol
# yerine /spa-fallback.html görünürdü.
map $request_uri $uri_sorgusuz {
    "~^(?<yol>[^?]*)" $yol;
    default           $request_uri;
}

log_format sorgusuz '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri_sorgusuz $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    access_log /var/log/nginx/access.log sorgusuz;

    # IPv6 de açık: konteyner içinde `localhost` önce ::1'e çözülür ve yalnızca
    # IPv4 dinlenirse sağlık kontrolü "connection refused" alır — site dışarıdan
    # (IPv4 üzerinden) çalıştığı için bu arıza yalnızca konteyner içinde görünür.
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rapor gövdesi ve ileride logo yüklemesi için; varsayılan 1 MB dar.
    client_max_body_size 12m;

    # Sürüm bilgisi yanıt başlığında dolaşmasın.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: uygulama tamamen kendi kökeninden beslenir (paketlenmiş JS/CSS,
    # kendi fontları, aynı köken API). index.html'de satır içi script YOK;
    # style için 'unsafe-inline' kalır — React'in ürettiği stil öznitelikleri
    # (SVG şema/grafikler) nonce alamaz. Yeni bir dış kaynak eklemek bu
    # başlığı bilinçli genişletmeyi gerektirir — sessizce çalışmayacaktır.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Konteyner sağlık kontrolü — SPA geri düşüşünden ÖNCE gelmeli, yoksa
    # index.html döner ve kontrol her zaman "sağlıklı" görünür.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API ters vekili ----
    # `api` adı DEĞİŞKEN üzerinden çözülür ve resolver verilir. Gerekçe: sabit
    # yazıldığında nginx adı yalnızca açılışta bir kez çözer ve IP'yi süresiz
    # saklar — `docker compose up -d` yalnızca api'yi yeniden yarattığında
    # konteynerin IP'si değişir, nginx ölü adrese vekillemeye devam eder ve
    # site 502 verir. Ayrıca api ayakta değilken nginx hiç açılmaz.
    # 127.0.0.11 Docker'ın gömülü DNS'idir.
    #
    # Değişken kullanıldığında istek yolu kendiliğinden aktarılmaz, bu yüzden
    # `$request_uri` açıkça eklenir (/api/auth/login → api:8080/api/auth/login).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # burst: sayfa açılışında meşru istekler kümelenir (refresh + me +
        # liste) — nodelay ile anlık küme geçer, sürekli sel 503 alır.
        limit_req zone=api_edge burst=40 nodelay;
        limit_req_status 429;

        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # PDF/Excel üretimi (QuestPDF, ClosedXML) saniyeler sürebilir;
        # 60 sn'lik varsayılan okuma zaman aşımı büyük raporu keserdi.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Rapor gövdesi diske tamponlanmadan aksın.
        proxy_buffering off;
    }

    # ---- Statik varlıklar ----
    # Vite dosya adına içerik hash'i basar (assets/index-a1b2c3.js), bu yüzden
    # içerik değiştiğinde ad da değişir — süresiz önbellek güvenlidir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # Yazı tipleri: dosya adı ailenin/alt kümenin/ağırlığın kendisidir ve
    # içeriği o adla sabittir (web/scripts/build-fonts.mjs). Aşağıdaki genel
    # bloğun no-store kuralı bunlara UYGULANMAMALI — her sayfa açılışında 26
    # woff2'yi yeniden indirmek demek olurdu.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # Web app manifest'i. Ayrı blokta olmasının TEK nedeni içerik tipi:
    # nginx'in `mime.types` dosyasında `.webmanifest` yok ve dosya
    # `application/octet-stream` olarak gidiyordu (ölçüldü). Spec
    # `application/manifest+json` ister; yanlış tiple bazı tarayıcılar
    # manifest'i sessizce yok sayar, yani "ana ekrana ekle" hiç çıkmaz.
    # Sunucu seviyesinde `types` bloğu kullanılamazdı — o, mevcut bütün mime
    # eşlemelerini değiştirirdi.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # ---- HTML kabukları + SPA geri düşüşü ----
    #
    # `no-store` BU BLOKTA duruyor, ayrı bir `= /index.html` bloğunda değil.
    # Gerekçe: derleme sonrası prerender'dan (web/scripts/build-prerender.mjs)
    # sonra HTML kabuğu tek dosya değil — 38 sayfanın her biri kendi
    # `<yol>.html` dosyasını taşıyor, geri düşüş de `spa-fallback.html`.
    # `try_files` iç yönlendirmesi location'ı YENİDEN SEÇMEZ, yani ayrı bir
    # dosya-adı bloğu `/giris` gibi geri düşüşle gelen istekleri hiç
    # yakalamıyordu (ölçüldü: Cache-Control başlıksız dönüyordu). Kabuk
    # önbelleğe alınırsa kullanıcı, silinmiş hash'li varlıkları isteyen eski
    # bir sayfa üzerinde kalır ve site boş açılır.
    #
    # `$uri.html`: prerender çıktısı `arac/trace-width.html` biçimindedir.
    # Dizin biçimi (`<yol>/index.html`) nginx'te `/arac/trace-width` isteğini
    # `/arac/trace-width/` adresine 301'le yönlendiriyordu — sitemap'teki URL
    # eğik çizgisiz olduğu için bot her sayfada önce yönlendirme görürdü.
    #
    # Geri düşüş `/index.html` DEĞİL `/spa-fallback.html`: prerender'dan sonra
    # `dist/index.html` boş kabuk değil, ANA SAYFA. Geri düşüş onu gösterseydi
    # `/giris` isteği ana sayfanın HTML'ini alır ve hydration her açılışta
    # ayrışırdı — kenar durum değil, her kullanıcının gördüğü yol.
    # Zincirin sonundaki `/index.html` bilinçli emniyettir: prerender adımı hiç
    # koşmamış bir dist/ ile de site açılır, yalnız kazancı olmaz.
    #
    # BrowserRouter kullanılıyor: /giris diye bir DOSYA yoktur; geri düşüş
    # olmadan derin bağlantı yenilendiğinde 404 alınır — dağıtımın ilk
    # doğrulanacak maddesi budur (CLAUDE.md → dağıtım bölümü).
    # Ayrıntı: docs/prerender-karari.md §6.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # `$uri/index.html` zincirde ŞART: kök isteğinde (`/`) ne `$uri` ne de
        # `$uri.html` eşleşir ve prerender'lı ana sayfa atlanıp geri düşüşe
        # inilirdi (ölçüldü: `/` boş kabuk dönüyordu). `$uri/` yazılmadı —
        # var olmayan bir dizin isteğinde 403'e düşerdi.
        try_files $uri $uri.html $uri/index.html /spa-fallback.html /index.html;
    }
}
