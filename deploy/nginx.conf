# Süit kenarı (edge), TLS'siz — yerel yığın (docker-compose.yml, `edge`
# servisi). Üretimde bunun yerine nginx.prod.conf.template bağlanır (bkz.
# docker-compose.prod.yml). İki dosyanın /api, /pcb, /comm blokları birebir
# aynı tutulur.
#
# Faz 4 öncesi bu iş PCB'nin kendi imajı tarafından yapılıyordu (PCB kökte
# `/`'i işgal ediyor, kendi /api vekilini kendi taşıyordu — nginx.conf'un bu
# dosyası o zaman derlemede kullanılmıyordu, ölü/referans kopyaydı). Artık
# gerçek kenar burası: `/` landing'i sunar, `/pcb` ve `/comm` kendi
# konteynerlerine vekillenir, `/api` merkezde tek yerden.
#
# DİKKAT — nginx'te `add_header` MİRAS ALINMAZ: bir `location` kendi
# `add_header`'ını yazdığı anda üst seviyedekilerin HEPSİ o konumda düşer.
# Bu yüzden güvenlik başlıkları, kendi başlığı olan her konumda tekrarlanır.
#
# BİLİNEN ENGEL (go-live kapısı, CLAUDE.md → "Edge yönlendirme"). PCB ve Comm
# şu an KÖKTEN (`/`) servis edilecek şekilde derleniyor — Vite `base` hâlâ
# `/`. `/pcb/` ve `/comm/` altına AYNEN vekillendiklerinde (aşağıdaki
# bloklar), yukarı akış konteynerinin ürettiği HTML hâlâ `/assets/...` gibi
# KÖK-göreli varlık yolları taşır; tarayıcı o isteği edge'in KÖKÜNE
# (`/assets/...`) yapar, edge'de öyle bir location yok → 404, sayfa boş
# açılır. Bu dosya GELECEKTEKİ doğru davranış için yazıldı (vekillemede yol
# ÖNEKİ KORUNUR, silinmez — aşağıdaki `$request_uri` deseni): PCB kendi
# `base`'ini `/pcb/`'ye, Comm `/comm/`'a çevirip KENDİ nginx'lerinde de aynı
# öneki tanıyacak şekilde güncellenmeden `/pcb` ve `/comm` GERÇEKTEN
# ÇALIŞMAZ. Ayrıntı ve hangi depoda ne değişmesi gerektiği: deploy/README.md
# → "Bilinen engel: PCB/Comm base-path".

# Kenar hız sınırı — API'nin kendi kullanıcı-bazlı limiter'ının ÖNÜNDE kaba
# bir IP kapısı. İnce ayar uygulamada kalır (kullanıcı/uç başına politika);
# buradaki tek iş, uygulamaya hiç ulaşmaması gereken sel trafiğini nginx'te
# kesmek. conf.d dosyaları http bağlamına dahil edilir, zone burada tanımlanır.
limit_req_zone $binary_remote_addr zone=api_edge:10m rate=20r/s;

# Erişim günlüğünden SORGU DİZESİ düşürülür.
#
# Parola sıfırlama ve e-posta doğrulama bağlantıları token'ı sorguda taşır
# (Auth/AuthEndpoints.cs, ProductMail ile üretilen bağlantılar), `GET
# /api/auth/confirm-email` de öyle — ürün ne olursa olsun (`/pcb/...` ya da
# `/comm/...` altındaki iniş sayfaları da dahil, o sayfalar da token'ı sorguda
# taşıyıp API'ye iletir). nginx'in varsayılan `combined` biçimi $request
# içinde tam sorguyu yazdığı için bu token'lar erişim günlüğüne DÜZ METİN
# düşerdi: günlüğü okuyabilen herkes — operatör, log toplayıcı, yedek arşivi —
# "parolamı unuttum"a tıklamış her hesabı token ömrü boyunca devralabilirdi.
#
# Uygulama tarafında aynı karar zaten verilmiş durumda: Serilog istek
# özetinde sorguyu taşımaz. Bu blok kenarı da aynı hizaya getirir.
map $request_uri $uri_sorgusuz {
    "~^(?<yol>[^?]*)" $yol;
    default           $request_uri;
}

log_format sorgusuz '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri_sorgusuz $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rid=$request_id';

server {
    access_log /var/log/nginx/access.log sorgusuz;

    # IPv6 de açık: konteyner içinde `localhost` önce ::1'e çözülür ve yalnızca
    # IPv4 dinlenirse sağlık kontrolü "connection refused" alır — site dışarıdan
    # (IPv4 üzerinden) çalıştığı için bu arıza yalnızca konteyner içinde görünür.
    listen 80;
    listen [::]:80;
    server_name _;

    # Yalnızca landing'in statik dosyaları burada durur — PCB/Comm kendi
    # konteynerlerinde, kendi root'larında.
    root /usr/share/nginx/html;
    index index.html;

    # Rapor gövdesi ve ileride logo yüklemesi için; varsayılan 1 MB dar.
    # Sınır burada da uygulanır çünkü /api/ isteği önce edge'ten geçer.
    client_max_body_size 12m;

    # Sürüm bilgisi yanıt başlığında dolaşmasın.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # Konteyner sağlık kontrolü — landing geri düşüşünden ÖNCE gelmeli.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # `pcb`/`comm`/`api` adları DEĞİŞKEN üzerinden çözülür ve resolver
    # verilir. Gerekçe: sabit yazıldığında nginx adı yalnızca açılışta bir kez
    # çözer ve IP'yi süresiz saklar — `docker compose up -d` yalnızca ilgili
    # servisi yeniden yarattığında konteynerin IP'si değişir, nginx ölü
    # adrese vekillemeye devam eder ve 502 verir. Ayrıca hedef ayakta değilken
    # nginx hiç açılmaz. 127.0.0.11 Docker'ın gömülü DNS'idir.
    #
    # Değişken kullanıldığında istek yolu kendiliğinden aktarılmaz, bu yüzden
    # `$request_uri` açıkça eklenir — ve öneki KORUR (/pcb/arac/x →
    # pcb:80/pcb/arac/x, öneki SİLMEZ). Yukarıdaki "BİLİNEN ENGEL" notundaki
    # sözleşme budur.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- API ters vekili (tek merkez) ----
    location /api/ {
        # burst: sayfa açılışında meşru istekler kümelenir (refresh + me +
        # liste) — nodelay ile anlık küme geçer, sürekli sel 503 alır.
        limit_req zone=api_edge burst=40 nodelay;
        limit_req_status 429;

        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # İstek korelasyonu (docs/brifler/14-loglama-altyapi.md §2) — nginx'in
        # kendi ürettiği kimlik API'ye taşınır, `RequestIdMiddleware` onu
        # AYNEN kullanır. access_log'daki `rid=` alanıyla aynı değer.
        proxy_set_header X-Request-Id      $request_id;

        # PDF/Excel üretimi (QuestPDF, ClosedXML) saniyeler sürebilir;
        # 60 sn'lik varsayılan okuma zaman aşımı büyük raporu keserdi.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Rapor gövdesi diske tamponlanmadan aksın.
        proxy_buffering off;
    }

    # ---- Ürün SPA'ları (path routing) ----
    # Öneksiz istek (`/pcb`, `/comm`) öneke yönlendirilir — SPA'nın kendi
    # ürettiği göreli yollar önekin VAR olduğunu varsayar.
    location = /pcb { return 301 /pcb/; }
    location = /comm { return 301 /comm/; }

    # Vekilleme SEFFAFTİR: prefix silinmez, aynen iletilir (yukarıdaki
    # resolver notundaki sözleşme). PCB kendi konteynerinde kendi
    # try_files/SPA-geri düşüş zincirini kendi nginx'inde çalıştırır — edge
    # burada yalnızca yönlendirir, SPA'nın iç mantığına karışmaz.
    location /pcb/ {
        set $pcb_upstream http://pcb:80;
        proxy_pass $pcb_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-Id      $request_id;
    }

    # Comm için henüz yayınlanmış bir imaj/konteyner YOK (alp-comm-toolkit
    # Faz 2 olgunluğunda, Dockerfile'ı yok) — bu blok GELECEĞE hazır: `comm`
    # servisi tanımlanıp ayağa kalkana dek istekler 502 alır (nginx açılışta
    # patlamaz, çünkü ad açılışta değil İSTEK anında çözülür — yukarıdaki
    # resolver deseni tam da bunun için var). docker-compose.yml → `comm`
    # servisi (profil: comm).
    location /comm/ {
        set $comm_upstream http://comm:80;
        proxy_pass $comm_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-Id      $request_id;
    }

    # ---- Landing (statik, build'siz) ----
    # Tek dosya, istemci-taraflı rota yok — SPA geri düşüş zinciri gerekmez.
    # `no-store`: içerik dosya adı hash'i taşımıyor, değiştiğinde eski kopya
    # tarayıcıda kalmasın.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # script-src 'none': landing'de JS yok. style 'unsafe-inline':
        # index.html tek dosya, gömülü <style> taşır.
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ =404;
    }
}
