# PCB SPA'sını YERELDE derlemek için örtü — temel dosyanın üstüne biner.
#
#   docker compose -f docker-compose.yml -f docker-compose.pcb-local.yml up -d --build
#
# Ne zaman gerekir: SPA'nın DERLENMİŞ çıktısını doğrulamak (prerender'lı HTML,
# nginx try_files zinciri, canonical/hreflang, service worker). Günlük
# geliştirmede gerekmez — SPA kendi deposunda `npm run stack` ile koşar.
#
# ÖN KOŞUL: iki depo kardeş dizinlerde durmalı —
#   <bir dizin>/alp-platform      (bu depo)
#   <bir dizin>/alp-pcb-toolkit   (SPA)
# Başka bir yerdeyse aşağıdaki `context` yolu ona göre değiştirilir.

services:
  pcb:
    build:
      # SPA deposunun kökü: Dockerfile hem web/ kaynağını hem web/nginx.conf'u
      # oradan alır.
      context: ../../alp-pcb-toolkit
      dockerfile: web/Dockerfile
      args:
        # DERLEME zamanı değeri: sitemap.xml ve sayfaların canonical/hreflang
        # etiketleri statik dosyalara yazılır, çalışma zamanında değiştirilemez.
        # Boşsa placeholder alan adı yazılır ve derleme uyarı basar.
        # Değeri değiştirdikten sonra `--build` şart.
        VITE_SITE_URL: ${VITE_SITE_URL:-}
