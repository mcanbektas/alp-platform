# Temel yığın: postgres + api + edge (nginx, süit kenarı) + pcb (+ isteğe
# bağlı comm). api'yi YERELDE derler, ürün SPA'larını ghcr'dan çeker.
#
# Kullanım (bu dizinden):
#   cp .env.example .env   ve içindeki değerleri doldur
#   docker compose up -d --build
#   http://localhost:8080
#
# Üretimde bunun üstüne docker-compose.prod.yml biner ve `build:` yerine
# ghcr.io'daki hazır imajları kullanır — sunucu derleme yapmaz.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

# Compose proje adı — volume ve konteyner adlarının öneki. Ayrıştırmada
# `alp-pcb-toolkit`ten değişti (yığın artık tek ürünün değil, süitin).
# YEREL VOLUME UYARISI: eski adla oluşmuş `alp-pcb-toolkit_pgdata` ve
# `alp-pcb-toolkit_reports` volume'ları BU YIĞINA BAĞLANMAZ — yerelde durduran
# test verisi varsa `docker volume` ile elle taşınır. Sunucu henüz kurulmadığı
# için üretim verisi etkilenmez.
name: alp-platform

# Docker'ın varsayılan json-file sürücüsü SINIRSIZDIR: log dosyası konteyner
# yaşadıkça büyür ve küçük bir diskte en olası ilk kesinti buydu. Her servis
# aynı sınırı alır — kayıt kaybolmaz, disk dolmaz.
#
# `local` sürücüsü json-file'ın yerine geçer: aynı tavanı uygular ama diskte
# sıkıştırır ve `docker logs`/`docker compose logs` ile aynı şekilde okunur —
# tek fark diskte kapladığı yer. ~100 MB/servis tavan (20m × 5 dosya).
x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # Kaynak sınırları: kaçak bir sorgu ya da bellek baskısı bütün sunucuyu
    # (OOM killer) götürmesin — konteyner kendi sınırında ölür ve restart
    # politikasıyla geri gelir.
    mem_limit: 512m
    cpus: 1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api `service_healthy` bekler: Postgres hazır olmadan başlarsa açılıştaki
      # migration bağlantı hatasıyla düşer ve konteyner yeniden başlama
      # döngüsüne girer.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - alpnet

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # PDF dizgisi (QuestPDF/Skia) bellek yoğun — sınır bilinçli olarak en
    # geniş burada. Ölçülen tek istekle 7 GB'a tırmanma vakası artık boyut
    # kapısıyla kesiliyor; bu sınır o kapının arkasındaki son emniyettir.
    mem_limit: 1g
    cpus: 2
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      # Yerel yığın Development olarak koşar. Tek gerekçe: yenileme çerezi
      # üretimde Secure=true işaretlenir (AuthEndpoints.SetRefreshCookie) ve
      # tarayıcı Secure çerezi düz http://localhost üzerinde saklamaz —
      # yenileme akışı hiç sınanamazdı. Üretim override'ı Production'a çevirir.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-alp-pcb-toolkit}
      Jwt__Audience: ${JWT_AUDIENCE:-alp-pcb-toolkit}
      App__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:8080}
      # Comm SPA'sı bu depoda değil, ayrı repoda kendi `npm run stack`'iyle
      # koşar (alp-comm-toolkit) — burada yalnız CORS'un ve kimlik
      # postalarının onu tanıması için origin'i verilir. Boş bırakılırsa
      # Comm CORS'a girmez, PCB etkilenmez (bkz. Program.cs).
      App__Products__comm__FrontendBaseUrl: ${COMM_FRONTEND_BASE_URL:-http://localhost:3001}
      # Yönetim paneline girebilecek hesapların e-postaları (virgülle ayrılır).
      # Yetkinin TEK kaynağı budur: panelden ya da kayıttan admin olunamaz.
      # Değiştirdikten sonra api yeniden başlatılır — eşitleme açılışta koşar.
      App__AdminEmails: ${ADMIN_EMAILS:-}
      # TLS ters vekilde biter; konteynerdeki uygulama yalnızca HTTP dinler.
      App__HttpsRedirection: "false"
      # nginx'in bulunduğu ağ tanıtılmazsa X-Forwarded-For yok sayılır ve
      # bütün istekler tek IP'ye düşer (hız sınırı tek kova olur).
      App__KnownProxyNetworks__0: ${PROXY_NETWORK:-172.28.0.0/16}
      # Denetim izinin (AuditEvents) en çok saklanacağı gün sayısı —
      # AuditCleanupService bu sınırdan eski kaydı periyodik siler. Gizlilik
      # ve KVKK metninde beyan edilen süreyle AYNI kalmalı.
      App__AuditRetentionDays: ${AUDIT_RETENTION_DAYS:-365}
      # Operasyonel log ekranının (/yonetim/loglar) bellek içi halka tampon
      # kapasitesi — denetim iziyle (yukarıdaki AuditRetentionDays) KARIŞTIRMA,
      # bu tampon uçucudur. Yan bulgu (docs/brifler/14-loglama-altyapi.md):
      # bu satır DAHA ÖNCE hiç yoktu — appsettings.json'daki 500 varsayılanı
      # sessizce kullanılıyordu, .env'deki LOG_BUFFER_SIZE hiçbir yere bağlı
      # değildi.
      App__LogBufferSize: ${LOG_BUFFER_SIZE:-500}
      # Hesap kilidi: kaç başarısız denemeden sonra ve kaç dakikalığına.
      # Kilitlenme anında iki bağlantılı bir posta gider (kilidi aç / parolayı
      # sıfırla), bu yüzden süre cömert tutulabilir — AuthEndpoints.Login.
      App__LockoutMaxAttempts: ${LOCKOUT_MAX_ATTEMPTS:-3}
      App__LockoutMinutes: ${LOCKOUT_MINUTES:-10}
      Database__MigrateOnStartup: "true"
      # Üretilen rapor için depolama ayarı yoktur: belge diske yazılmaz, "tekrar
      # indir" kaydedilmiş hesaplardan yeniden üretir.
      # Kalıcı volume: anahtarlar konteynerle birlikte silinirse o an postası
      # yolda olan doğrulama/parola sıfırlama bağlantıları geçersizleşir.
      DataProtection__KeysPath: /app/App_Data/keys
      Reports__FontsPath: /app/fonts
      # SMTP verilmezse konsol göndericisine düşer (postalar günlüğe yazılır).
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-ALP PCB Toolkit}
      Smtp__Security: ${SMTP_SECURITY:-StartTls}
      # Boşsa sink hiç eklenmez (Program.cs) — yalnız bu Docker yığınında
      # dolu. docs/loglama-karari.md §12: sunucu (brif 06) henüz yok, bu
      # yüzden yalnız local compose'da; prod compose'a taşınmadı.
      Seq__Url: http://seq
    volumes:
      - reports:/app/App_Data
    networks:
      - alpnet

  # Operasyonel log deposu (docs/loglama-karari.md §12). stdout'un YANINDA
  # durur, yerine geçmez — `docker compose logs api` hâlâ çalışır. Retention
  # env ile kurulmuyor: ilk açılışta Seq arayüzünden (Settings → Retention)
  # elle bir sınır konmalı, yoksa `seqdata` volume'u sınırsız büyür.
  seq:
    image: datalust/seq:2024.3
    restart: unless-stopped
    logging: *default-logging
    environment:
      ACCEPT_EULA: "Y"
    mem_limit: 256m
    cpus: 0.5
    ports:
      # Yalnız localhost — dışarıya kapalı, admin arayüzüne geliştiricinin
      # kendi makinesinden http://localhost:5341 ile erişilir.
      - "127.0.0.1:5341:80"
    volumes:
      - seqdata:/data
    networks:
      - alpnet

  pcb:
    # PCB SPA'sı BU DEPODA DEĞİL — kendi deposunda yaşar ve kendi imajını
    # ghcr.io'ya iter (mcanbektas/alp-pcb-toolkit). Burada hazır imaj çekilir.
    #
    # Faz 4 öncesi bu servisin adı `web` idi ve dışarıya doğrudan port açardı
    # (kendi nginx'i süitin tek girişiydi). Artık girişi `edge` üstlendi; bu
    # konteyner ağ İÇİNDE kalır, host'a port YAYINLAMAZ (aşağıda `ports:` yok
    # — kasıtlı, edge'in `/pcb/` bloğu buraya vekiller).
    #
    # SPA'yı yerelde derleyerek denemek için pcb-local örtüsü eklenir (iki depo
    # kardeş dizinlerde duruyorsa çalışır):
    #   docker compose -f docker-compose.yml -f docker-compose.pcb-local.yml up -d --build
    #
    # Günlük geliştirmede bu yığın GEREKMEZ: SPA kendi deposunda `npm run stack`
    # ile koşar ve /api'yi buradaki api servisine vekiller.
    image: ${PCB_IMAGE_PREFIX:-ghcr.io/mcanbektas/alp-pcb-toolkit}/web:${PCB_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # Statik dosya + ters vekil — nginx'e bu kadarı bol bile.
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      api:
        condition: service_healthy
    networks:
      - alpnet

  # Comm SPA'sı — alp-comm-toolkit henüz Faz 2 olgunluğunda ve BİR İMAJ
  # YAYINLAMIYOR (Dockerfile'ı yok). `profiles: [comm]` bilerek: bu servis
  # `docker compose up` içinde varsayılan olarak BAŞLAMAZ — imajı olmayan bir
  # servisi zorunlu kılmak, PCB-tek dünyadaki herkesin `docker compose up`unu
  # kırardı (ghcr'dan çekilemeyen imaj → pull hatası). İmaj yayınlanınca ya
  # profili kaldırıp varsayılana alınır ya da `docker compose --profile comm
  # up -d` ile açıkça istenir. Yerelde derleyerek denemek için comm-local
  # örtüsü (pcb-local ile aynı desen): docker-compose.comm-local.yml.
  comm:
    profiles: ["comm"]
    image: ${COMM_IMAGE_PREFIX:-ghcr.io/mcanbektas/alp-comm-toolkit}/web:${COMM_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      api:
        condition: service_healthy
    networks:
      - alpnet

  # Süit kenarı — TEK dış giriş. Landing'i (statik) doğrudan sunar, `/pcb` ve
  # `/comm`'u kendi konteynerlerine vekiller, `/api`'yi merkezde tek yerden
  # api'ye vekiller. Faz 4 öncesi bu iş `web`(PCB) konteynerinin kendi
  # gömülü nginx'indeydi — artık ayrı, ürün-bağımsız bir servis.
  #
  # Resmi `nginx:alpine` imajı YETERLİ — özel bir Dockerfile'a gerek yok:
  # yapılandırma ve landing'in statik dosyaları salt-okunur bind mount'la
  # taşınır (aşağıdaki volumes). Bir image derlemek yerine mount kullanmak,
  # landing içeriğini ya da nginx kuralını değiştirmenin `git pull` + `docker
  # compose up -d` kadar basit kalmasını sağlar — image rebuild gerekmez
  # (nginx.prod.conf.template zaten aynı desenle çalışıyordu).
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      api:
        condition: service_healthy
      pcb:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # Hedef `templates/` altıdır, `conf.d/default.conf` DEĞİL — bilerek:
      # resmi nginx imajının giriş noktası `templates/*.template`i her
      # açılışta envsubst'tan geçirip aynı `conf.d/default.conf`'u YAZAR.
      # Hedef doğrudan `conf.d/default.conf` olsaydı bu dosya salt-okunur
      # bind mount olurdu ve docker-compose.prod.yml örtüsü aynı hedefe
      # nginx.prod.conf.template'i bağlayınca (aynı desen, prod override
      # kazanır) giriş noktası salt-okunur dosyanın ÜSTÜNE yazmaya çalışıp
      # açılışta patlardı. `nginx.conf`'ta `${...}` biçiminde OS ortam
      # değişkeni YOK (yalnızca `$request_uri` gibi nginx'in KENDİ çalışma
      # zamanı değişkenleri var) — envsubst yalnızca gerçekten TANIMLI OS
      # değişkenlerini değiştirir (nginx.prod.conf.template'teki aynı notla
      # aynı gerekçe), yani dosya buradan byte-aynı geçer.
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ../landing:/usr/share/nginx/html:ro
    networks:
      - alpnet

volumes:
  pgdata:
  # Ad tarihsel: bu volume artık rapor DOSYASI tutmuyor (raporlar saklanmıyor),
  # yalnızca /app/App_Data/keys altındaki Data Protection anahtarlarını taşıyor.
  # Yeniden adlandırılmadı: adı değiştirmek yeni ve BOŞ bir volume demek olur,
  # yani o an postası yolda olan doğrulama bağlantılarının geçersizleşmesi.
  reports:
  seqdata:

networks:
  alpnet:
    driver: bridge
    ipam:
      config:
        # Alt ağ sabitlenir: api'nin App__KnownProxyNetworks değeri bu aralığa
        # bakar. Docker'ın seçtiği rastgele aralıkla bırakılırsa değer her
        # ortamda tutmaz ve gerçek istemci IP'si sessizce kaybolur.
        - subnet: ${PROXY_NETWORK:-172.28.0.0/16}
