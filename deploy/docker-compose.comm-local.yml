# Comm SPA'sını YERELDE derlemek için örtü — pcb-local.yml ile birebir aynı
# desen. `comm` servisi temel dosyada `profiles: [comm]` altında olduğu için
# bu örtüyle birlikte de profil AÇIKÇA istenmeli:
#
#   docker compose -f docker-compose.yml -f docker-compose.comm-local.yml \
#     --profile comm up -d --build
#
# alp-comm-toolkit artık bir `web/Dockerfile` yayınlıyor (Faz 2 borcu kapandı).
#
# ÖN KOŞUL: ÜÇ dizin kardeş olmalı —
#   <bir dizin>/alp-platform       (bu depo)
#   <bir dizin>/alp-comm-toolkit   (SPA)
# Başka bir yerdeyse hem `context` hem `additional_contexts` yolu ona göre
# değiştirilir.
#
# `additional_contexts`: Comm, @mcanbektas/design'ı henüz GitHub Packages'tan
# değil `file:../alp-platform/design` ile alıyor (paket yayınlanmadı — o
# depodaki CLAUDE.md → "Bilinen borçlar"). Docker'ın build context'i TEK
# dizinle sınırlı olduğu için design paketi ayrı bir isimli context olarak
# veriliyor; Dockerfile içinde `COPY --from=alp-platform-design …` ile
# okunuyor. Paket yayınlanınca (Faz 4) bu satır ve Dockerfile'daki design
# derleme aşaması birlikte düşer.
services:
  comm:
    build:
      context: ../../alp-comm-toolkit
      dockerfile: web/Dockerfile
      additional_contexts:
        alp-platform-design: ../../alp-platform/design
